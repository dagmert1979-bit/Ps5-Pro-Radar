name: Build & Release Android APK Direct Download

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK for Direct Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PS5-Pro-Radar.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Pro-Radar-APK
          path: PS5-Pro-Radar.apk

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "PS5 Pro Radar Android APK (v1.0.${{ github.run_number }})"
          body: "Direkter APK-Download für Android (`PS5-Pro-Radar.apk`). Einfach unten auf `PS5-Pro-Radar.apk` tippen, um die App direkt herunterzuladen und zu installieren."
          files: PS5-Pro-Radar.apk
